  decisions:
  - id: D1
    title: 初始语言
    content: '**跟随系统**：任一系统语言 tag 以 zh 开头 → zh-cn，否则 en-us（与 abnk-website `resolveBrowserLocale`
      同口径）；用户手动切换后以持久化偏好优先'
    date: '2026-11-11'
  - id: D2
    title: 词条语言方向
    content: '**中文为源（template），英文为语义重写**——按英语母语者与金融行业惯用语组织句子，不逐字直译（如「等额本息」→ amortizing
      loan with equal monthly installments）；适用于 en-us JSON 词条与 `app_en.arb`'
    date: '2026-11-11'
  - id: D3
    title: 数据文案
    content: '**双语两套数据集 + 部署期切换**：mock/fixtures 提供 zh-cn/en-us 两套完整文件，由统一环境变量 `ABNK_DATA_LOCALE`（来源部署
      env 样例 `abnk-system/deploy/prod/env/abnk-fullstack.env.example`，经 Dockerfile
      `ARG` 注入——链路 Phase 2 任务 2.2 落地）选择——backoffice 经 Vite 构建注入、mobile 经 `--dart-define`
      注入；运行时 UI 语言切换**不**切换数据集；真实后端多语言数据不在本轮范围（另立 Phase）。**〔2026-11-12 修订，Phase 7〕**：数据集改为**运行时随
      UI 语言切换**（用户手动切换 UI → 数据集跟随 zh→zh-cn / en→en-us，mock 内存态重置）；`ABNK_DATA_LOCALE`
      语义收敛为「初始数据语言注入」（缺省 en-us「应用数据默认英文」口径）；判据体系变更见 Phase 7 文档'
    date: '2026-11-11'
    revised_in_phase: '7'
  - id: D4
    title: '`.asdm` 双语范围'
    content: '**仅 `workspace/`**：现有内容整体迁入 `workspace/zh-CN/`，建 `workspace/en-US/`
      骨架（内容按需后补，不要求一次性翻译）；toolsets 内容**不动**，但其引用的 `.asdm/workspace/...` 路径随迁移同步。**〔2026-11-15
      修订，Phase 5 扩名触发〕**：locale 标识改为置于**文档叶子层**（`partXX/zh-CN/{文档}`），结构树与证据资产语言无关——原「整体迁入
      workspace/zh-CN」口径废弃（顶层分层使结构树耦合语言，en-US 镜像约定守不住）；en-US 从「骨架树」改为「生长规则」（路径即 doc
      id、en 为语义重写、缺失 fallback、index 层注册）；toolsets 引用仍指向 zh-CN 物理路径（内容不动条款延续）。修订详情见
      Phase 5 文档「方案要点」。'
    date: '2026-11-11'
    revised_in_phase: '5'
  - id: D5
    title: backoffice 选型
    content: '**零依赖自建 i18n，与 abnk-website 同构**（`resources/locale-context/locale-provider/use-locale/interpolate`
      同名同构，JSON 词条 + `Widen` 类型推导 + `satisfies` 编译期结构校验）；不引入 i18next 等第三方库'
    date: '2026-11-11'
  - id: D6
    title: backoffice 语言事实来源
    content: '**localStorage（方案 A）**：URL 无语言前缀、路由层零侵入；与 abnk-website 的「URL 前缀唯一事实源」差异是有意的（工具型应用无
      SEO/分享诉求，website 方案自述其前缀选择是单页锚点站场景驱动），差异在 i18n 模块注释中声明'
    date: '2026-11-11'
  - id: D7
    title: mobile 选型
    content: Flutter 官方 `gen-l10n`（ARB），template 为 `app_zh.arb`；语言切换走既有 `AppState`（ChangeNotifier）+
      `ListenableBuilder` 整树重建链路，不新增状态管理依赖；持久化引入 `shared_preferences`
    date: '2026-11-11'
  - id: D8
    title: locale 命名
    content: 代码层统一小写 `zh-cn` / `en-us`（与 abnk-website 一致，BCP 47 大写仅用于 `<html lang>`）；`.asdm`
      目录按 D4 用大写 `zh-CN` / `en-US`
    date: '2026-11-11'
  - id: D9
    title: 资产仓归一与 dev portal 立项
