      / commit B 注入）；③ dev portal 立项：独立仓 `git@github.com:amazingbank/abnk-devportal.git`（public
      空仓已建，域名 dev.amazingbank.ai 已配 DNS），按 [ADR-010](../../../../planning/abnk-design/adr/zh-CN/010-repository-openness.md)
      开放边界执行——详规划见 `../part04/v0.0.1-Part04-Plan.md`；④ 生成器归属：index/metrics 生成器是 abnk-asdm
      仓自审工具（脚本 + 产出物双入库），portal 只做只读复制消费——「提取入库、构建纯复制」。
    date: '2026-11-15'
