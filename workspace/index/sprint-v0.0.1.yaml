  decisions:
  - id: D1
    title: 仓形态
    content: '**独立仓 `abnk-devportal`**（public 空仓已建）——属性域区分：abnk-system 是业务系统交付域，dev
      portal 是软件工程管理域的产物（过程资产渲染器）；与官网 D9 独立仓同模式（定位差异大不混仓）；技术栈统一不受同仓与否约束（design tokens
      跨仓共享复用 D9 的 env 覆盖机制 `ABNK_WEBSITE_TAILWIND` 先例）'
    date: '2026-11-15'
  - id: D2
    title: 域名
    content: '**dev.amazingbank.ai**（DNS 已配置指向 abnk-vm001；复用 `*.amazingbank.ai` 通配符证书零新增成本；部署走
      `abnk-prod-deploy` 工具集两阶段铁门）'
    date: '2026-11-15'
  - id: D3
    title: 语言策略
    content: UI 双语（**第三次同构复刻** abnk-website i18n：零依赖自建 + `Widen`/`satisfies` 编译期校验，Part03
      Phase 1 已为 backoffice 复刻过一次，模式成熟）；内容 zh 全量 + en 增量 fallback（index 层 locale 路由，不靠目录树）
    date: '2026-11-15'
  - id: D4
    title: 数据形态
    content: '**build-time 静态**（延续 ADR-008 官网零 API 精神）：portal 构建对 abnk-asdm 只读复制（index
      产出物原样（sprint yaml + metrics/loc json）+ md 全文 + 证据素材），vite build 时渲染；**提取入库、构建纯复制**——生成器是
      abnk-asdm 仓的自审工具（脚本 + 产出物双入库，index 的 git history 即数据可信度审计记录），portal 构建零提取逻辑（checkout
      两仓 → 拷贝 → build，任何机器可复现）；MCP 动态聚合列为 roadmap 板块如实展示'
    date: '2026-11-15'
  - id: D5
    title: 开源口径
    content: ghcr 公共镜像（D8 延续）+ 仓 public（ADR-010 直接推论）；数据源仓 abnk-asdm 已 public
    date: '2026-11-15'
  - id: D6
    title: 指标诚实性
    content: 仪表盘如实展示未完成项（挂账、移交、CI 未实跑按「规划中」标注）——**透明包括透明地展示未完成**；此口径写入 Phase 3 验收判据
    date: '2026-11-15'
  - id: D7
    title: portal 纯渲染器约束
    content: 只做内容渲染，不长运营功能——用户互动/注册/统计属社区运营域（ADR-010 边界 2，归 abnk-website）；技术形态（build-time
      静态）与策略边界互锁，两重理由都写死
    date: '2026-11-15'
