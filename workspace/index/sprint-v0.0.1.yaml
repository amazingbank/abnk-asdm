  decisions:
  - id: D1
    title: 拦截落点
    content: 按最接近真实银行的方式：**custom Business Step（服务端权威）+ 网关预检 + 客户端 UX** 三层；基线只预埋落点（任务
      P0.5），拦截逻辑是 POC 演示增量
    date: '2026-11-06'
  - id: D2
    title: 登录方式
    content: 简化登录（网关自签 JWT + Bearer），**暂不引入 Keycloak**；用户凭据 PBKDF2 哈希
    date: '2026-11-06'
  - id: D3
    title: 契约方式
    content: 契约先行（最接近真实银行）：OpenAPI spec 为唯一事实源，Dart/TS client 全部生成，双前端零手写 API 类型
    date: '2026-11-06'
  - id: D4
    title: Flutter 载体
    content: '**web + iOS + Android 三目标**（模拟器与真机均支持）；macOS 桌面仅为内部调试可选项，不属渠道'
    date: '2026-11-06'
  - id: D5
    title: 运行形态
    content: 容器化（prod 形态）；本地开发可先宿主进程
    date: '2026-11-06'
  - id: D6
    title: 文档修正
    content: 现有文档随时修正，不阻塞本计划
    date: '2026-11-06'
  - id: D7
    title: P0.4 平台暴露形态
    content: 平台 8080 **直接公网暴露**（原「内网回环 + SSH 隧道」口径废弃）：NSG 放行 8080 为部署前置（Azure Portal
      操作）；POC 口径接受 Basic Auth 直暴露，公网 TLS 终止与网关收口仍在 P3
    date: '2026-11-07'
  - id: D8
    title: 制品库
    content: '**GitHub Packages 公共包**（`ghcr.io/amazingbank/abnk-*`）：ABNK 定位开源可演示银行系统（展示
      ASDM 全 SDLC AI 能力），公开性是设计目标——五服务镜像全部公共（存储/流量免费无配额、匿名 pull 免登录、回滚可拉历史 tag）。推送
      PAT 只存 `.github-private` + 服务器 docker config；本地 Mac 构建的镜像不推送不发布（仅调试）；禁止覆盖已推送
      tag；审计门新增第 5 节 PAT 扫描（5 节 → 6 节）。铁律 2 演进：服务端构建后**追加 push**，compose 引用 ghcr FQN'
    date: '2026-11-10'
  - id: D9
    title: 官网独立仓
    content: '`channels/website` 迁出为**独立私有仓 `amazingbank/abnk-website`**（subtree split
      保留全部历史，发版链 0.1.1/0.1.2 可追溯）：站点定位为 amazingbank.ai 入口（对外展示/资源提供/方法论链接 asdm.ai），未来承载社区管理能力，与
      ABNK 开源银行系统定位差异大，**不适合完全开源**。ghcr 包 `abnk-website` 同步转 private（**D8 修订：五公共 →
      四公共 + 一私有**）；服务器部署链切至新仓（专用只读 deploy key，仓库级 `core.sshCommand`），compose 编排不动（镜像
      FQN 引用不变）；design-tokens 同步链跨仓化（`ABNK_WEBSITE_TAILWIND` env 可覆盖，验证 PASS DIFF:
      0）'
    date: '2026-11-10'
